# CodeRabbit runs beside gaal's review bot, whose revise round (revise-pr)
# works every open review thread. These settings stop CodeRabbit from feeding
# that loop on every push.
#
# - One review per PR. Re-reviewing each push finds fresh edge cases in the
#   code the last revise round wrote, so the loop runs to its round cap and
#   gaal ejects an approved PR (seen on #83 and #86). Comment
#   `@coderabbitai review` for another pass.
# - No unprompted replies. It still answers when mentioned.
# - Never request changes: gaal's review bot is the approver.
# - Autofix on. "Fix CodeRabbit comments" pushes fixes for its own findings.
#   A push dismisses gaal's approval, so gaal re-reviews the new head before
#   anything merges.
#
# `inheritance: true` merges this file over the settings in CodeRabbit's web UI.
# Without it the file replaces them, and anything set only there reverts to the
# default.
inheritance: true
reviews:
  request_changes_workflow: false
  auto_review:
    auto_incremental_review: false
  finishing_touches:
    autofix:
      enabled: true
chat:
  auto_reply: false
