#
# Auto-hide obvious spam on issue / PR comments.
# Hide-only: matched comments are minimized as "spam" (collapsed, reversible).
# Only comments from non-members are ever touched, so maintainers can't trip it.
# The age gate and spam patterns live in scripts/vet_pr.py, shared with vet-fork-pr.yml.
name: Moderate comments

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  moderate:
    runs-on: ubuntu-latest
    # Skip anyone with a trusted relationship to the repo.
    if: >
      github.event.comment.author_association != 'OWNER' &&
      github.event.comment.author_association != 'MEMBER' &&
      github.event.comment.author_association != 'COLLABORATOR'
    steps:
      # issue_comment runs on the default branch, so this is the repo's own script.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Reads the comment from $GITHUB_EVENT_PATH and writes hide=true|false.
      - name: Score
        id: score
        run: python scripts/vet_pr.py --comment-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hide
        if: steps.score.outputs.hide == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.graphql(
              `mutation ($id: ID!) {
                 minimizeComment(input: { subjectId: $id, classifier: SPAM }) {
                   minimizedComment { isMinimized }
                 }
               }`,
              { id: context.payload.comment.node_id },
            );
            core.info('Comment minimized as spam.');
